<article class="card" [class.active]="isFavorite()">
  @if (event().imageUrl) {
    <img [src]="event().imageUrl" [alt]="event().title" />
  } @else {
    <div class="no-image">{{ event().category }}</div>
  }

  <span class="badge">{{ event().category | uppercase }}</span>
  <h3>{{ event().title }}</h3>
  <p>{{ event().date | date:'dd/MM/yyyy' }} · {{ event().place }}</p>
  <p>
    @if (event().price === 0) { Gratuit } @else { {{ event().price | currency:'EUR' }} }
  </p>

  <button (click)="favoriteToggled.emit(event().id)">
    @if (isFavorite()) { ★ Retirer des favoris } @else { ☆ Ajouter aux favoris }
  </button>
  <button (click)="deleteRequested.emit(event().id)">Supprimer</button>
  <a [routerLink]="['/events', event().id]">Voir les détails</a>
</article>
