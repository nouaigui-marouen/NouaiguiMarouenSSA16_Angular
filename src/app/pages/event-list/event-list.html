<h2>Événements</h2>
<p>Total : {{ service.eventCount() }} · Favoris : {{ service.favoriteCount() }} · Gratuits : {{ service.freeEventCount() }}</p>

<div class="filters">
  @for (c of categories; track c) {
    <button [class.active]="selectedCategory() === c" (click)="selectCategory(c)">{{ c }}</button>
  }
</div>

<section class="grid">
  @for (event of visibleEvents(); track event.id) {
    <app-event-card
      [event]="event"
      [isFavorite]="service.isFavorite(event.id)"
      (favoriteToggled)="onToggleFavorite($event)"
      (deleteRequested)="onDelete($event)" />
  } @empty {
    <p>Aucun événement disponible</p>
  }
</section>
