@if (event(); as e) {
  <h2>{{ e.title }}</h2>
  @if (e.imageUrl) {
    <img [src]="e.imageUrl" [alt]="e.title" />
  }
  <p>{{ e.description }}</p>
  <p>{{ e.date | date:'longDate' }} — {{ e.place }}</p>
  <p>{{ e.price === 0 ? 'Gratuit' : (e.price | currency:'EUR') }}</p>
} @else {
  <p>Aucun événement ne correspond à cet identifiant.</p>
}
